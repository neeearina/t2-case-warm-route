name: warm-route
x-app: &app
  build:
    context: .
  image: warm-route-app:local
  environment: &env
    DATABASE_URL: postgresql://warm:local-demo@db:5432/warm
    TEMPORAL_ADDRESS: temporal:7233
    MOCK_URL: http://mocks:8000
    WEATHER_PROVIDER: ${WEATHER_PROVIDER:-mock}
    POLL_SECONDS: ${POLL_SECONDS:-60}
    RECHECK_SECONDS: ${RECHECK_SECONDS:-1800}
  restart: unless-stopped
services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: warm
      POSTGRES_PASSWORD: local-demo
      POSTGRES_DB: warm
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U warm -d warm']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  temporal:
    image: temporalio/temporal@sha256:003508da05989e7cf0d583cfce521c4bb2732e733574e3040db8f1284783baa2
    user: "0:0" # Local dev server needs write access to its named volume.
    command: [server, start-dev, --ip, 0.0.0.0, --db-filename, /data/temporal.db]
    volumes:
      - temporal:/data
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, localhost:7233]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  init:
    <<: *app
    command: [python, -m, app.init_db]
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
  mocks:
    <<: *app
    command: [uvicorn, app.mocks:app, --host, 0.0.0.0, --port, '8000']
  api:
    <<: *app
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      init:
        condition: service_completed_successfully
  worker:
    <<: *app
    command: [python, -m, app.worker]
    depends_on:
      init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      mocks:
        condition: service_started
volumes:
  postgres:
  temporal:
